<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020005">
  <title>The Perfect Bloom</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@1,400;1,600;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div id="vignette"></div>
  <div id="ambientGlow"></div>

  <div id="ui" aria-live="polite">
    <div class="loading-card" id="card">
      <div class="rose-symbol" aria-hidden="true">🌹</div>
      <div class="eyebrow">A LITTLE MOMENT</div>
      <h1>LOVE.CSS</h1>
      <p class="intro">Watch the garden come alive.</p>

      <button id="bloom-btn" type="button">
        <span>START BLOOM</span>
        <span class="btn-shine" aria-hidden="true"></span>
      </button>
      <div class="hint">Click once. Drag to rotate 3D view.</div>
    </div>
  </div>

  <div id="message-wrap">
    <div id="message">
      <span class="message-line">To the sweetest flower in my life's garden,</span>
      <span class="message-line">thank you for blooming next to me through every single season.</span>
      <span class="message-line accent">You are irreplaceable. Tanvi💕</span>
    </div>
    <button id="replay-btn" type="button" aria-label="Replay the bloom animation">↻ Replay</button>
  </div>

  <div id="status">
    <span class="status-dot"></span>
    <span id="status-text">Waiting to bloom</span>
  </div>

  <button id="sound-btn" class="icon-btn" type="button" aria-label="Toggle bloom sound" aria-pressed="false">♫</button>
  <div id="cursor-glow"></div>

  <!-- Background Track: Inaam -->
  <audio id="bg-music" loop preload="auto">
    <source src="./Inaam_2.mp3" type="audio/mpeg">
    <source src="./Inaam.mp3" type="audio/mpeg">
  </audio>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="./script.js"></script>
</body>

</html>
